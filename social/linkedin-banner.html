<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Banner LinkedIn — Geovane Gofredo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Inter', system-ui, sans-serif;
    color: #F0EDE4;
    background:
      radial-gradient(ellipse 55% 130% at 86% -8%, rgba(31, 91, 85, 0.55), transparent 62%),
      radial-gradient(ellipse 45% 100% at 4% 110%, rgba(198, 162, 107, 0.10), transparent 65%),
      linear-gradient(118deg, #0B1615 0%, #10332F 55%, #0B2522 100%);
  }
  .rule-bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: #C6A26B;
  }
  .monogram {
    position: absolute;
    left: 64px; top: 45px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    letter-spacing: 0.16em;
    color: #F0EDE4;
  }
  .monogram span { color: #C6A26B; }
  .content {
    position: absolute;
    left: 548px;
    top: 66px;
    width: 930px;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #C6A26B;
  }
  h1 {
    margin-top: 18px;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 86px;
    font-weight: 400;
    line-height: 0.96;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    color: #F6F2E8;
  }
  h1 span { color: #7FB8B1; }
  .tagline {
    margin-top: 24px;
    max-width: 780px;
    font-size: 23px;
    line-height: 1.38;
    color: #DCE5DF;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 30px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #9EACA7;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #C6A26B;
    flex: none;
  }
  .url { color: #A9D4CE; }
</style>
</head>
<body>
  <div class="monogram">GG<span>.</span></div>
  <div class="content">
    <div class="kicker">Liderança de TI · Governança · Service Delivery</div>
    <h1>Geovane <span>Gofredo</span></h1>
    <p class="tagline">Transformo operações críticas em ambientes estáveis,<br>seguros e previsíveis.</p>
    <div class="meta">
      <span>ITSM/SDM · Operações e Infraestrutura</span>
      <span class="dot"></span>
      <span class="url">geovaneyu.github.io/portfolio</span>
    </div>
  </div>
  <div class="rule-bottom"></div>
</body>
</html>
