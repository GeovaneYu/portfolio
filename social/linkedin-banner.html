<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Banner LinkedIn — Geovane Gofredo (D v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1584px;height:396px;overflow:hidden}
  body{font-family:'Inter',system-ui,sans-serif;background:#111111;color:#F4F4F0;position:relative}
  .grid-lines{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 420px 0 520px;pointer-events:none}
  .grid-lines i{width:1px;background:rgba(244,244,240,.06)}
  .monogram{position:absolute;top:30px;right:56px;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;letter-spacing:-.02em;text-transform:uppercase;color:#F4F4F0}
  .monogram i{font-style:normal;color:#FF4D00}
  .inner{position:absolute;inset:0;padding:52px 56px 46px 540px;display:flex;flex-direction:column;justify-content:center}
  .kicker{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A6A6A0}
  .sq{width:8px;height:8px;background:#FF4D00;flex:none}
  h1{font-family:'Archivo',sans-serif;font-size:80px;line-height:.92;font-weight:900;letter-spacing:-.03em;text-transform:uppercase;margin-top:18px}
  h1 em{font-style:normal;color:#FF4D00}
  .tag{margin-top:18px;font-family:'Archivo',sans-serif;font-size:21px;line-height:1.25;font-weight:700;max-width:820px}
  .pills{display:flex;gap:10px;margin-top:26px}
  .pill{border:1px solid rgba(244,244,240,.22);border-radius:999px;padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#CFCFC8}
  .pill.hot{border-color:#FF4D00;color:#FF4D00}
</style>
</head>
<body>
<div class="grid-lines"><i></i><i></i><i></i><i></i></div>
<div class="monogram">GG<i>.</i></div>
<div class="inner">
  <div>
    <div class="kicker"><span class="sq"></span> Liderança de TI · Governança · Service Delivery</div>
    <h1>Geovane <em>Gofredo</em></h1>
    <p class="tag">Transformo operações críticas em ambientes estáveis,<br>seguros e previsíveis.</p>
    <div class="pills"><span class="pill hot">ITSM/SDM</span><span class="pill">N1 · N2 · N3</span><span class="pill">São Paulo, SP</span></div>
  </div>
</div>
</body>
</html>
