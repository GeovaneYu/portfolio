<!doctype html>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1584px;height:396px;overflow:hidden}
  body{font-family:'Inter',system-ui,sans-serif;background:#F4F4F0;color:#111111;position:relative}

  .tag{margin-top:16px;font-family:'Archivo',sans-serif;font-size:20px;line-height:1.3;font-weight:700}

  <div class="content">
    <div class="kicker"><span class="sq"></span> Liderança de TI · Governança · Service Delivery</div>
    <h1>Geovane <em>Gofredo</em></h1>

    <div class="meta"><span>ITSM/SDM · Operações e Infraestrutura</span><span class="dot"></span><span class="url">geovaneyu.github.io/portfolio</span></div>
  </div>
</div>
<div class="edge"></div>
